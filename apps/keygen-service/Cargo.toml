[package]
name = "keygen-service"
version = "0.1.0"
edition = "2024"
description = "Lightweight local activation key service for Activateur RMS"

[[bin]]
name = "KeyGenService"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keygen-common = { path = "../../crates/config" }
native-tls = "0.2"
postgres = "0.19"
postgres-native-tls = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tiny_http = "0.12"
