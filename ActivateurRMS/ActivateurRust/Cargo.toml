[package]
name = "activateur-rms"
version = "0.1.0"
edition = "2024"
description = "Native Windows installer and activation UI for Activateur RMS"

[[bin]]
name = "ActivateurRMS"
path = "src/main.rs"

[dependencies]
keygen-common = { path = "../KeyGenCommonRust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
